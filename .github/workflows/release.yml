name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: pan-pipe
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: pan-pipe.exe
            archive_ext: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../pan-pipe-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive_ext }} ${{ matrix.binary_name }}
          cd ../../..
          ls -lh pan-pipe-*.tar.gz

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../pan-pipe-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive_ext }} ${{ matrix.binary_name }}
          cd ../../..
          ls -lh pan-pipe-*.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: pan-pipe-*.${{ matrix.archive_ext }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
