[package]
name = "pan-pipe"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["pan-pipe contributors"]
license = "MIT"
repository = "https://github.com/pan-pipe/pan-pipe"
description = "AI-assisted development workflow installer for multiple coding agents"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
inquire = "0.7"
similar = "2"
thiserror = "1"
anyhow = "1"
owo-colors = "4"
anstream = "0.6"
anstyle = "1"
urlencoding = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
chrono = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
insta = "1"

[profile.release]
lto = true
strip = true
